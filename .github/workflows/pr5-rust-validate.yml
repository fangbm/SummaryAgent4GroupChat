name: PR Rust Validate

on:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Rust clippy
        working-directory: rust-agent
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests and GUI compile check
        working-directory: rust-agent
        run: |
          cargo test --workspace --exclude wechat-summary-gui
          cargo check -p wechat-summary-gui
