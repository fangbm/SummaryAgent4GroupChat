name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Python checks
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Rust format
        working-directory: rust-agent
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: rust-agent
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests and GUI compile check
        working-directory: rust-agent
        run: |
          cargo test --workspace --exclude wechat-summary-gui
          cargo check -p wechat-summary-gui
      - name: WinUI build and tests
        shell: pwsh
        run: |
          dotnet test .\windows-ui\SummaryAgent4GroupChat.WinUI.sln -c Release -p:Platform=x64
          dotnet publish .\windows-ui\src\SummaryAgent4GroupChat.WinUI\SummaryAgent4GroupChat.WinUI.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64
      - name: Inno installer build and smoke check
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          .\scripts\package-windows-installer.ps1
          $installer = Get-ChildItem .\dist -File -Filter 'SummaryAgent4GroupChat-Inno-Setup-windows-x64-*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 1MB) {
            throw 'Inno installer was not produced or is unexpectedly small.'
          }
          # /CURRENTUSER skips elevation: the runner shell is non-elevated and
          # a silent admin install would exit immediately without installing.
          # Start-Process -Wait is required: PowerShell does not wait for
          # GUI-subsystem executables invoked with &, so $LASTEXITCODE would
          # still hold choco's code while the installer runs in background.
          $installLog = Join-Path $env:TEMP 'summary-agent-smoke-install.log'
          Remove-Item $installLog -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $installer.FullName -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS',
            '/CURRENTUSER', "/LOG=$installLog"
          )
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 40 }
            throw "Silent installer smoke test failed with exit code $($proc.ExitCode)."
          }
          $installedExe = Join-Path $env:LOCALAPPDATA 'SummaryAgent4GroupChat\SummaryAgent4GroupChat.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 40 }
            throw "Installer did not place the WinUI executable at $installedExe."
          }
          Write-Host "Installer smoke check passed: $($installer.FullName)"
      - name: Python lint and tests
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m ruff check .
          .\.venv\Scripts\python.exe -m mypy src
          .\.venv\Scripts\python.exe -m coverage run -m pytest -q
          .\.venv\Scripts\python.exe -m coverage report --fail-under=60
