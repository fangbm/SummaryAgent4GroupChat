name: CI

# Lightweight checks for pull requests. Full packaging + installer smoke test
# lives in package-smoke.yml and runs on main.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-agent
      - name: Install Python checks
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Rust format
        working-directory: rust-agent
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: rust-agent
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests and GUI compile check
        working-directory: rust-agent
        run: |
          cargo test --workspace --exclude wechat-summary-gui
          cargo check -p wechat-summary-gui
      - name: WinUI tests
        shell: pwsh
        run: dotnet test .\windows-ui\SummaryAgent4GroupChat.WinUI.sln -c Release -p:Platform=x64
      - name: Python lint and tests
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m ruff check .
          .\.venv\Scripts\python.exe -m mypy src
          .\.venv\Scripts\python.exe -m coverage run -m pytest -q
          .\.venv\Scripts\python.exe -m coverage report --fail-under=60
