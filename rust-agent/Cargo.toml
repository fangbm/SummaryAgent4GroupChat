[workspace]
members = [
    "crates/ai",
    "crates/app",
    "crates/control",
    "crates/core",
    "crates/gui",
    "crates/storage",
    "crates/wx4py-client",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
version = "0.2.1"
# usize::is_multiple_of and other std APIs used by the workspace require 1.87.
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serenity = { version = "0.12", default-features = false, features = ["builder", "chrono", "client", "gateway", "http", "model", "rustls_backend", "utils"] }
sha2 = "0.10"
md5 = "0.7"
thiserror = "1.0"
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4"] }
zstd = "0.13"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading"] }
