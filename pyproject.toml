[project]
name = "wx-summary-agent"
version = "0.1.0"
description = "Cross-platform WeChat AI group summary pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=23.2",
    "aiohttp>=3.9",
    "fastapi>=0.111",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]
windows = [
    "wx4py>=0.2.1; platform_system == 'Windows'",
    "wxauto>=39.1.12; platform_system == 'Windows' and python_version < '3.13'",
]
wcferry = [
    "wcferry>=39.5.2.0; platform_system == 'Windows'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
